# ByteTrack for the Origin One camera. Ultralytics defaults, except track_buffer: 90 frames
# (6 s at the simulated 15 fps) bridge occlusions (people walking behind pillars) without new IDs.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
