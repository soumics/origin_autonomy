# Nav2 for the Avular Origin One (skid-steer, Ouster OS1-32), with RTAB-Map providing /map and
# TF map -> icp_odom -> odom -> base_link. Based on nav2_bringup's default nav2_params.yaml (Jazzy).
#
# Frames: the wheel odometry (odom) drifts heavily when a skid-steer base turns, so everything
# that needs a smooth local frame uses icp_odom (lidar-corrected odometry) instead.
# Obstacles: the self-filtered Ouster cloud (/robot/lidar/points_filtered), 3D voxel layer.
# Command chain: controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#                -> collision_monitor -> /robot/cmd_vel

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /robot/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # No BackUp recovery (see behavior_trees/navigate_to_pose_no_backup.xml); path set by launch.
    default_nav_to_pose_bt_xml: "navigate_to_pose_no_backup.xml"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    odom_topic: /robot/odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14   # exploration goals do not care about the final heading
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.4
      vx_min: 0.0          # never reverse: low obstacles close behind are invisible to the Ouster
      vy_max: 0.0
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      initial_transform_timeout: 60.0   # wait for RTAB-Map's TF (icp_odom / map) at startup
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: icp_odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Origin One outline incl. wheels: 0.66 x 0.58 m
      footprint: "[[0.33, 0.29], [0.33, -0.29], [-0.33, -0.29], [-0.33, 0.29]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: lidar
        lidar:
          topic: /robot/lidar/points_filtered
          data_type: "PointCloud2"
          min_obstacle_height: 0.08   # above ground returns
          max_obstacle_height: 0.8    # robot passes under anything higher
          clearing: True
          marking: True
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      initial_transform_timeout: 60.0   # wait for RTAB-Map's TF (icp_odom / map) at startup
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      footprint: "[[0.33, 0.29], [0.33, -0.29], [-0.33, -0.29], [-0.33, 0.29]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: lidar
        lidar:
          topic: /robot/lidar/points_filtered
          data_type: "PointCloud2"
          min_obstacle_height: 0.08
          max_obstacle_height: 0.8
          clearing: True
          marking: True
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true   # frontier goals border unknown space

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: icp_odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]   # no reversing
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: /robot/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    # Wheel odometry: 50 Hz and accurate over the 1.2 s look-ahead. icp_odom is published ~40 ms
    # after each scan, which makes the scan-time TF lookup fail.
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /robot/cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 3.0   # lidar arrives irregularly over the robot's Wi-Fi (1 s stopped the robot)
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      # Fixed outline in base_link (the costmap's published footprint is stamped in icp_odom,
      # which lags the scans by one ICP step and makes the lookup fail).
      points: "[[0.33, 0.29], [0.33, -0.29], [-0.33, -0.29], [-0.33, 0.29]]"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["lidar"]
    lidar:
      type: "pointcloud"
      topic: /robot/lidar/points_filtered
      min_height: 0.08
      max_height: 0.8
      enabled: True
