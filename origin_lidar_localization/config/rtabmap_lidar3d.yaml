# RTAB-Map 3D lidar SLAM for the Origin One (Ouster OS1-32, 10 Hz).
# Based on rtabmap_examples/lidar3d.launch.py. RTAB-Map parameters must be strings.
#
# TF chain: map -> icp_odom -> odom -> base_link
#   odom -> base_link   wheel odometry (Gazebo DiffDrive / robot base)
#   icp_odom -> odom    icp_odometry correction (wheel odometry is the motion guess)
#   map -> icp_odom     rtabmap graph optimization

/**:
  ros__parameters:
    frame_id: base_link
    wait_for_transform: 0.2
    qos: 2                          # best effort: matches reliable and best-effort lidar publishers
    Icp/PointToPlane: "true"
    Icp/Iterations: "10"
    Icp/VoxelSize: "0.1"            # indoor: 0.1-0.3
    Icp/Epsilon: "0.001"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    Icp/MaxTranslation: "3"
    Icp/MaxCorrespondenceDistance: "1.0"   # 10 x voxel size
    Icp/Strategy: "1"               # libpointmatcher
    Icp/OutlierRatio: "0.7"
    Icp/RangeMin: "0.8"             # drop returns from the robot's own body and GNSS antenna
    Reg/Force3DoF: "true"           # ground robot: x, y, yaw only

/**/icp_odometry:
  ros__parameters:
    odom_frame_id: icp_odom
    guess_frame_id: odom            # use wheel odometry as motion prior; publishes icp_odom -> odom
    expected_update_rate: 15.0
    Odom/ScanKeyFrameThr: "0.4"
    OdomF2M/ScanSubtractRadius: "0.1"
    OdomF2M/ScanMaxSize: "15000"
    OdomF2M/BundleAdjustment: "false"
    Icp/CorrespondenceRatio: "0.01"

/**/rtabmap:
  ros__parameters:
    map_frame_id: map
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_odom_info: true
    subscribe_scan_cloud: true
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/AngularUpdate: "0.05"
    RGBD/LinearUpdate: "0.05"
    Mem/NotLinkedNodesKept: "false"
    Mem/STMSize: "30"
    Reg/Strategy: "1"               # ICP
    Icp/CorrespondenceRatio: "0.2"  # minimum scan overlap to accept a loop closure

    # Occupancy grid: 3D (OctoMap) plus the 2D /map projection used by Nav2 and exploration
    RGBD/CreateOccupancyGrid: "true"
    Grid/Sensor: "0"                # from the lidar point cloud
    Grid/3D: "true"
    Grid/CellSize: "0.05"
    Grid/RangeMin: "0.8"
    Grid/RangeMax: "20.0"
    Grid/RayTracing: "true"         # clear free space; needed for frontier exploration
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0.05"
    Grid/MaxObstacleHeight: "1.0"   # robot is ~0.45 m tall; ignore ceilings and high shelves
